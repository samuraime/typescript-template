# Prettier Configuration Principles
# 1. Readability: Code should be clear and easy to scan
# 2. Git-diff-friendly: Minimize unnecessary changes in diffs
# 3. Follow conventions: Align with community standards
# 4. Easy to type: Prefer characters accessible without Shift or modifier keys

# Readability and Git-diff-friendly
trailingComma: all
singleAttributePerLine: true
experimentalOperatorPosition: start
experimentalTernaries: false # will become default in a future version

# Easy to type
singleQuote: true
